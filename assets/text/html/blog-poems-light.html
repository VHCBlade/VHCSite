<h1>Light</h1>
<p>Take your gift and make<br />
A light for God's sake<br />
Shining burning bright<br />
Casting out the night  </p>
<p>Practiced virtue stand<br />
Answer life's demands<br />
Fueled from above<br />
Spreading joy and love  </p>
